<script>
(function(){
  function setReparayaActiveNav(){
    const path = window.location.pathname.replace(/\/+$/, "/");
    const hash = window.location.hash;
    const links = document.querySelectorAll(".ry-fix-nav a");

    links.forEach(function(link){
      link.classList.remove("is-active");
    });

    let key = "inicio";

    if(hash === "#contacto"){
      key = "contacto";
    }else if(path.indexOf("/nuestros-servicios/") === 0){
      key = "servicios";
    }else if(path.indexOf("/nuestra-flota/") === 0){
      key = "flota";
    }else if(path.indexOf("/noticias/") === 0){
      key = "noticias";
    }

    const active = document.querySelector('.ry-fix-nav a[data-nav="' + key + '"]');
    if(active){
      active.classList.add("is-active");
    }
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", setReparayaActiveNav);
  }else{
    setReparayaActiveNav();
  }

  window.addEventListener("load", setReparayaActiveNav);
  window.addEventListener("hashchange", setReparayaActiveNav);
})();
</script>
