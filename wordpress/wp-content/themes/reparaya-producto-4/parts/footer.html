<style>
  .ry11-footer{
    position:relative;
    z-index:2;
    width:min(1400px, calc(100% - 56px));
    margin:24px auto 42px;
    color:#f3fbff;
  }

  .ry11-footer-shell{
    border-radius:38px;
    border:1px solid rgba(255,255,255,.18);
    background:

  }

  .ry11-footer-main{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:34px;
    padding:46px 42px 38px;
    align-items:stretch;
  }

  .ry11-footer-block{
    min-height:190px;

    flex-direction:column;
    align-items:center;

    text-align:center;
    padding:12px 18px;
  }

  }

    margin:0 0 18px;
    color:#ffffff;
    font-size:1.15rem;
    font-weight:950;
  }

  .ry11-footer-block p{
    max-width:360px;
    margin:0 auto;
    color:rgba(243,251,255,.74);
    line-height:1.75;
  }

  .ry11-footer-icon{
    width:72px;
    height:72px;
    display:grid;
    place-items:center;
    margin:0 auto 18px;
    border-radius:22px;
    color:#07151b;
    background:linear-gradient(135deg, #fff2a6, #d4af37 48%, #9a6f20);
    box-shadow:0 18px 46px rgba(212,175,55,.28);
    font-size:1.75rem;
    font-weight:950;
  }

  .ry11-footer-item small{
    display:block;
    color:#ffe98a;
    text-transform:uppercase;
    letter-spacing:.18em;
    font-size:.70rem;
    font-weight:950;
    margin-bottom:10px;
  }

  .ry11-footer-item strong{
    display:block;
    color:#ffffff;
    font-size:1.55rem;
    line-height:1.15;
    font-weight:950;
  }

  .ry11-footer-item span{
    display:block;
    color:rgba(243,251,255,.75);
    line-height:1.7;
    font-size:1rem;
  }

  .ry11-footer-copy{
    padding:20px 40px 24px;
    border-top:1px solid rgba(255,255,255,.16);
    text-align:center;
    color:rgba(243,251,255,.66);
    line-height:1.7;
  }

  @media (max-width:980px){
    .ry11-footer-main{
      grid-template-columns:1fr;
      gap:10px;
    }

    .ry11-footer-block{
      min-height:auto;
    }
  }
</style>
